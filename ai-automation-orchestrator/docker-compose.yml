version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  airflow:
    image: apache/airflow:2.11.2
    environment:
      _PIP_ADDITIONAL_REQUIREMENTS: |
        apache-airflow==2.11.2
        psycopg2-binary==2.9.11
        playwright==1.46.0
        robotframework==6.0.1
        robotframework-seleniumlibrary==6.1.0
        pyyaml==6.0.1
        pendulum>=3.0.0,<4.0
        setuptools>=70.1
        pandas
        wheel
        cython
        SQLAlchemy==1.4.54
        requests==2.31.0
        urllib3==2.1.0
        charset_normalizer==3.3.0
        marshmallow==3.21.1
        flask-limiter==3.5.0
        redis==5.0.3
        apache-airflow-providers-microsoft-azure==8.0.0
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__WEBSERVER__WORKERS: '2'
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    volumes:
      - ./dags:/opt/airflow/dags
      - ./automation:/opt/airflow/automation
      - ./config:/opt/airflow/config
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
      - ./init_airflow.sh:/docker-entrypoint-initdb.d/init_airflow.sh
    ports:
      - 8080:8080
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    command: standalone

volumes:
  postgres_data:
